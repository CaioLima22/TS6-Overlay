name: Release

# Uma tag "v1.2.3" vira uma release no GitHub com instalador e pacote de atualização.
# Os apps instalados encontram a release nova sozinhos (Velopack).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Versão a partir da tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "VERSION=$version" >> $env:GITHUB_ENV

      - run: dotnet test tests/TsOverlay.Tests -c Release

      - name: Publicar
        run: dotnet publish src/TsOverlay -c Release -r win-x64 --self-contained -p:Version=${{ env.VERSION }} -o publish

      - run: dotnet tool install -g vpk --version 1.2.161

      - name: Baixar a release anterior (para gerar o delta)
        shell: pwsh
        run: |
          vpk download github --repoUrl "${{ github.server_url }}/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}"
          # Na primeira release não existe anterior; sem ela só não há delta
          if ($LASTEXITCODE -ne 0) { Write-Host "Sem release anterior"; exit 0 }

      - name: Empacotar
        run: vpk pack -u TsOverlay -v ${{ env.VERSION }} -p publish -e TsOverlay.exe --packTitle "TS Overlay" --packAuthors "Caio" --icon src/TsOverlay/Assets/app.ico

      - name: Enviar para o GitHub
        run: vpk upload github --repoUrl "${{ github.server_url }}/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --publish --releaseName "TS Overlay ${{ env.VERSION }}" --tag "${{ github.ref_name }}"
